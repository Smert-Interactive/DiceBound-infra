name: dicebound-production

services:
  backend:
    image: ghcr.io/smert-interactive/dicebound-backend:sha-b264499a02d33867211dd92c5d5d2d169cc39bcf
    restart: unless-stopped

    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?ALLOWED_ORIGINS is required}

    expose:
      - "3000"

    networks:
      - application
      - database

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    depends_on:
        backend:
          condition: service_healthy
    image: ghcr.io/smert-interactive/dicebound-frontend:sha-54810f1de4f271891bc3cc59391d1bb332a2b116
    restart: unless-stopped

    ports:
      - "127.0.0.1:20080:80"

    networks:
      - application

networks:
  application:

  database:
    external: true
    name: postgres-net
